<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Checkout flow</title>
  <desc id="desc">Confirm order entry point, checkout controller, order processing service, and the backend stages grouped underneath.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text {
        fill: #102a43;
        font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
      }
      .arrow {
        fill: none;
        stroke: #475569;
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .entry {
        fill: #dff4ff;
        stroke: #205375;
        stroke-width: 2.5;
      }
      .file {
        fill: #fff4d6;
        stroke: #b45309;
        stroke-width: 2.5;
      }
      .group {
        fill: #fffbef;
        stroke: #d97706;
        stroke-width: 2.5;
      }
      .group-title {
        fill: #8a4b0f;
        font-size: 20px;
        font-weight: 700;
      }
      .node-title {
        font-size: 18px;
        font-weight: 600;
      }
      .stage-text {
        fill: #4a2d00;
        font-size: 17px;
        font-weight: 600;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="400" fill="#ffffff"/>

  <ellipse class="entry" cx="250" cy="92" rx="122" ry="34"/>
  <text x="250" y="98" text-anchor="middle" class="node-title">Confirm Order</text>

  <rect class="file" x="444" y="60" width="264" height="64" rx="18"/>
  <text x="576" y="98" text-anchor="middle" class="node-title">CheckoutController</text>

  <rect class="file" x="794" y="60" width="304" height="64" rx="18"/>
  <text x="946" y="98" text-anchor="middle" class="node-title">OrderProcessingService</text>

  <line class="arrow" x1="372" y1="92" x2="444" y2="92"/>
  <line class="arrow" x1="708" y1="92" x2="794" y2="92"/>

  <rect class="group" x="180" y="172" width="900" height="128" rx="24"/>
  <text x="630" y="205" text-anchor="middle" class="group-title">Main stages</text>

  <path class="arrow" d="M 946 124 L 946 152 L 730 152 L 730 202"/>

  <rect class="file" x="220" y="224" width="118" height="52" rx="14"/>
  <rect class="file" x="366" y="224" width="122" height="52" rx="14"/>
  <rect class="file" x="520" y="224" width="154" height="52" rx="14"/>
  <rect class="file" x="706" y="224" width="146" height="52" rx="14"/>
  <rect class="file" x="884" y="224" width="126" height="52" rx="14"/>

  <text x="279" y="256" text-anchor="middle" class="stage-text">Prepare</text>
  <text x="427" y="256" text-anchor="middle" class="stage-text">Payment</text>
  <text x="597" y="256" text-anchor="middle" class="stage-text">Persist Order</text>
  <text x="779" y="256" text-anchor="middle" class="stage-text">Move Items</text>
  <text x="947" y="256" text-anchor="middle" class="stage-text">Finalize</text>

  <line class="arrow" x1="338" y1="250" x2="366" y2="250"/>
  <line class="arrow" x1="488" y1="250" x2="520" y2="250"/>
  <line class="arrow" x1="674" y1="250" x2="706" y2="250"/>
  <line class="arrow" x1="852" y1="250" x2="884" y2="250"/>
</svg>
